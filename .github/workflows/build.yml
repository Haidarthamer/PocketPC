name: build

# Authoritative compiler + test runner for this project.
# The development sandbox has no Android SDK and cannot reach Maven Central, so
# every engineering claim must be backed by a green run here. Output is committed
# back under ci/ because the Azure-hosted workflow log hosts are unreachable from
# the sandbox.
on:
  push:
    branches: ['arena/**', main]
    paths-ignore:
      - 'ci/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.console=plain
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin && chmod +x gradlew

      # Each step tees into ci/build.log so failures are readable later.
      - name: Unit tests (capability logic)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :system:capability:test 2>&1 | tee -a ci/build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee -a ci/build.log

      - name: Inspect APK
        run: |
          set -o pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "## APK"
            ls -l "$APK"
            "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$APK" 2>/dev/null | head -20
          } | tee -a ci/build.log

      - name: Assemble evidence
        if: always()
        run: |
          mkdir -p ci
          {
            echo "# Build evidence"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| run | [$GITHUB_RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| date | $(date -u +%FT%TZ) |"
            echo "| java | $(java -version 2>&1 | head -1) |"
            echo "| gradle | $(gradle --version 2>/dev/null | grep -E '^Gradle' || echo unknown) |"
            echo "| result | **${{ job.status }}** |"
            echo
            echo "## Unit tests"
            echo '```'
            find . -path '*build/test-results*' -name '*.xml' -print0 2>/dev/null |
              xargs -0 -r grep -h -o '<testsuite [^>]*>' || echo "no test XML produced"
            echo '```'
            echo
            echo "## Gradle output (tail)"
            echo '```'
            tail -n 120 ci/build.log 2>/dev/null || echo "no log"
            echo '```'
          } > ci/build-evidence.md
          cat ci/build-evidence.md

      - name: Commit evidence + wrapper
        if: always() && github.event_name == 'push'
        run: |
          git config user.name  "pocketpc-ci[bot]"
          git config user.email "pocketpc-ci@users.noreply.github.com"
          git add -f ci/build-evidence.md ci/build.log gradle/wrapper gradlew gradlew.bat 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "ci(evidence): build ${{ job.status }} for ${GITHUB_SHA:0:7}"
          git push
